<form (submit)="$event.preventDefault(); sauvegarder()" class="user-form">
  <h3>Ajouter un utilisateur</h3>

  <div class="champ">
    <label for="nom">Nom *</label>
    <input id="nom" type="text" [formField]="userForm.nom" />
    @if (userForm.nom().touched() && userForm.nom().invalid()) {
      <p class="erreur">{{ userForm.nom().errors()[0].message }}</p>
    }
  </div>

  <div class="champ">
    <label for="email">Email *</label>
    <input id="email" type="email" [formField]="userForm.email" />
    @if (userForm.email().touched() && userForm.email().invalid()) {
      <p class="erreur">{{ userForm.email().errors()[0].message }}</p>
    }
  </div>

  <div class="champ">
    <label for="role">Rôle *</label>
    <select id="role" [formField]="userForm.role">
      <option value="user">Utilisateur</option>
      <option value="admin">Administrateur</option>
      <option value="guest">Invité</option>
    </select>
  </div>

  <div class="champ-checkbox">
    <label>
      <input type="checkbox" [formField]="userForm.actif" />
      Compte actif
    </label>
  </div>

  <div class="actions">
    <button
      type="submit"
      [disabled]="userForm().invalid() || userForm().submitting()"
      class="btn-ajouter"
    >
      @if (userForm().submitting()) {
        Envoi en cours...
      } @else {
        Ajouter
      }
    </button>
    <button type="button" (click)="reset()" class="btn-reset">
      Réinitialiser
    </button>
  </div>
</form>
